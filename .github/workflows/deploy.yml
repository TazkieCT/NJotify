name: CI-CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build --no-cache \
            -t ghcr.io/${{ env.OWNER_LC }}/njotify-backend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER_LC }}/njotify-backend:latest \
            ./Backend

      - name: Build frontend image
        run: |
          docker build --no-cache \
            -t ghcr.io/${{ env.OWNER_LC }}/njotify-frontend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER_LC }}/njotify-frontend:latest \
            ./NJotify

      - name: Push images
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/njotify-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/njotify-backend:latest
          docker push ghcr.io/${{ env.OWNER_LC }}/njotify-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/njotify-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            cd ~/NJotify

            cat <<EOF > .env
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            IMAGE_TAG=${GITHUB_SHA}
            EOF

            docker compose pull --policy always
            docker compose up -d --force-recreate
            docker image prune -f