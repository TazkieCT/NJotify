name: CI-CD

on:
  push:
    branches: [ main ]

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Login to GHCR
          run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        - name: Build backend image
          run: |
            docker build -t ghcr.io/${{ github.repository_owner }}/njotify-backend:latest ./Backend

        - name: Build frontend image
          run: |
            docker build -t ghcr.io/${{ github.repository_owner }}/njotify-frontend:latest ./NJotify

        - name: Push images
          run: |
            docker push ghcr.io/${{ github.repository_owner }}/njotify-backend:latest
            docker push ghcr.io/${{ github.repository_owner }}/njotify-frontend:latest

    deploy:
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: SSH Deploy
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SERVER_IP }}
            username: root
            key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/njotify

            export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export POSTGRES_DB=${{ secrets.POSTGRES_DB }}

            docker compose pull
            docker compose up -d